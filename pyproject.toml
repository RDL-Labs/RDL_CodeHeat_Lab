[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdl-codeheat"
version = "0.1.0"
description = "Finite code cost observations and local difference accumulation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["codeheat*"]
